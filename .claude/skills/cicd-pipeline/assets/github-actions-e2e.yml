# Copy to: .github/workflows/e2e-tests.yml
name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1-5"          # 02:00 UTC weekdays - cross-browser nightly
  workflow_dispatch:
    inputs:
      tags:
        description: "Behave tag expression (blank = all scenarios)"
        required: false
        default: ""
      browsers:
        description: "Browsers to run"
        type: choice
        default: chromium
        options: [chromium, firefox, webkit, all]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ALLURE_VERSION: "2.30.0"
  HEADLESS: "true"
  CI_SCRIPTS: .claude/skills/cicd-pipeline/scripts

jobs:
  lint:
    name: Lint & Parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt ruff pip-audit
      - name: Ruff (fatal errors only)
        run: ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: Gherkin parse + undefined steps
        run: python -m behave --dry-run --no-summary
      - name: Dependency audit
        run: pip-audit -r requirements.txt
        continue-on-error: true      # make blocking once the baseline is clean

  plan:
    name: Plan browser matrix
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.set.outputs.browsers }}
    steps:
      - id: set
        env:                          # pass inputs via env, never inline ${{ }} in run (injection)
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.browsers }}
        run: |
          ALL='["chromium","firefox","webkit"]'
          if [ "$EVENT" = "schedule" ] || [ "$CHOICE" = "all" ]; then
            echo "browsers=$ALL" >> "$GITHUB_OUTPUT"
          elif [ -n "$CHOICE" ]; then
            echo "browsers=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'browsers=["chromium"]' >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: [lint, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write                   # JUnit annotations on the PR
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    env:
      BROWSER: ${{ matrix.browser }}
      TAGS: ${{ inputs.tags }}
      # Only map secrets that exist - an empty secret overrides Config defaults with "".
      # TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install browser + OS deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Install OS deps only (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps ${{ matrix.browser }}

      - name: Run tests
        run: bash "$CI_SCRIPTS/run_tests.sh"

      - name: Zero-test guard
        if: always()
        run: |
          COUNT=$(grep -ho '<testcase ' results/junit/*.xml 2>/dev/null | wc -l)
          echo "Executed test cases: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "::error::No scenarios executed - check TAGS/FEATURES"; exit 1; }

      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: results/junit/*.xml
          check_name: JUnit (${{ matrix.browser }})

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.browser }}
          path: results/
          retention-days: 14

  report:
    name: Allure Report
    needs: e2e
    if: always() && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: all-results

      - name: Merge results
        run: |
          mkdir -p allure-results
          for d in all-results/*/allure-results; do cp -r "$d"/. allure-results/; done
          BROWSERS=$(ls all-results | sed 's/^results-//' | paste -sd, -)
          printf 'Browsers=%s\nBranch=%s\nCommit=%s\n' "$BROWSERS" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            > allure-results/environment.properties
          cat all-results/*/flaky-candidates.txt 2>/dev/null > flaky.txt || true

      - name: Restore Allure history from Pages
        continue-on-error: true
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sfL "$SITE/history/$f" -o "allure-results/history/$f" || true
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate report
        run: |
          curl -sL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" | tar xz
          "./allure-${ALLURE_VERSION}/bin/allure" generate allure-results -o allure-report --clean

      - name: Job summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          s = json.loads(pathlib.Path("allure-report/widgets/summary.json").read_text())["statistic"]
          print("## E2E Results\n\n| Total | Passed | Failed | Broken | Skipped |")
          print("|---|---|---|---|---|")
          print(f"| {s['total']} | {s['passed']} | {s['failed']} | {s['broken']} | {s['skipped']} |")
          flaky = pathlib.Path("flaky.txt")
          if flaky.exists() and flaky.read_text().strip():
              print("\n### Flaky candidates (passed on rerun)\n```\n" + flaky.read_text() + "```")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: allure-report/

  deploy:
    name: Publish to Pages
    needs: report
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
