[behave]
# Output format
formatter = json
outfiles = results/allure-results/behave.json

# Feature file paths
features = features

# Show skipped tests
show_skipped = True

# Show undefined steps
show_undefined = True

# Logging configuration
logging.clear_existing_handlers = True
logging.level = DEBUG
logging.format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

# Tags to exclude
exclude_tags = @wip @skip

# Parallel execution
parallel = False
